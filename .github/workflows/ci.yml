# CI pipeline (Phase 6): on every push and every pull request, GitHub builds the
# project on a clean Ubuntu machine and runs all the checks below. If any step
# fails, the run is marked with a red cross on the commit / pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    shell: bash  # bash with "pipefail": a failing command inside a pipe fails the step

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install compiler, libraries and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libsqlite3-dev libsodium-dev \
                                  catch2 cppcheck gcovr

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=all --std=c++17 --inline-suppr \
                   --suppress=missingIncludeSystem --suppress=unmatchedSuppression \
                   --error-exitcode=1 -q \
                   -Isrc/domain -Isrc/data -Isrc/logic -Isrc/presentation src

      - name: Configure (with coverage)
        run: cmake -S . -B build -G Ninja -DLMS_COVERAGE=ON

      - name: Build (warnings are errors)
        run: |
          cmake --build build 2>&1 | tee build.log
          if grep -q "warning:" build.log; then echo "Compiler warnings found"; exit 1; fi

      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure

      - name: System tests
        run: python3 tests/system/run_system_tests.py build/lms system-test-run

      - name: Coverage of the business-logic layer (must be at least 70%)
        run: |
          gcovr -r . build --filter src/logic/ --fail-under-line 70 | tee coverage.txt
          gcovr -r . build --filter src/logic/ --html-details coverage.html

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.txt
            coverage*.html
            system-test-run/*.txt
            system-test-run/results.json
